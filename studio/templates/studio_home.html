{% extends "base.html" %}

{% block title %}Studio Home - AI Video Studio{% endblock %}

{% block content %}
<div style="margin-top: 40px;">
    <div class="card">
        <h2>Active Productions</h2>
        <div id="jobs-list">
            <p style="opacity: 0.7;">Loading...</p>
        </div>
    </div>

    <div class="card">
        <h2>Quick Actions</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <a href="/new-production" class="btn btn-primary">
                ➕ New Production
            </a>
            <button onclick="createSampleJob()" class="btn btn-secondary">
                🧪 Create Sample Job (Test)
            </button>
        </div>
    </div>

    <div class="card">
        <h2>System Status</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 15px;">
            <div style="background: #2a2a2a; padding: 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 32px; font-weight: bold; color: #667eea;">7</div>
                <div style="opacity: 0.7; margin-top: 5px;">Active Agents</div>
            </div>
            <div style="background: #2a2a2a; padding: 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 32px; font-weight: bold; color: #10b981;" id="job-count">0</div>
                <div style="opacity: 0.7; margin-top: 5px;">Total Jobs</div>
            </div>
            <div style="background: #2a2a2a; padding: 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 32px; font-weight: bold; color: #fbbf24;">MOCK</div>
                <div style="opacity: 0.7; margin-top: 5px;">Generation Mode</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadJobs() {
    try {
        const response = await fetch('/api/jobs');
        const data = await response.json();
        const jobs = data.jobs;

        document.getElementById('job-count').textContent = jobs.length;

        if (jobs.length === 0) {
            document.getElementById('jobs-list').innerHTML = '<p style="opacity: 0.7;">No productions yet. Create one!</p>';
            return;
        }

        let html = '<div style="display: flex; flex-direction: column; gap: 15px;">';

        jobs.forEach(job => {
            const progress = Math.round(job.progress);
            const statusColor = job.is_complete ? '#10b981' : '#667eea';

            html += `
                <div style="background: #2a2a2a; padding: 20px; border-radius: 8px; border-left: 4px solid ${statusColor};">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <div>
                            <h3 style="font-size: 18px; margin-bottom: 5px;">${job.title}</h3>
                            <p style="opacity: 0.7; font-size: 14px;">Stage: ${job.stage}</p>
                        </div>
                        <div>
                            ${job.is_complete
                                ? '<span style="background: #10b981; padding: 5px 10px; border-radius: 6px; font-size: 12px;">✓ Complete</span>'
                                : '<span style="background: #667eea; padding: 5px 10px; border-radius: 6px; font-size: 12px;">In Progress</span>'
                            }
                        </div>
                    </div>

                    <div style="background: #1a1a1a; border-radius: 8px; height: 8px; overflow: hidden; margin: 15px 0;">
                        <div style="background: ${statusColor}; height: 100%; width: ${progress}%; transition: width 0.3s;"></div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <a href="/timeline/${job.job_id}" class="btn btn-primary" style="font-size: 13px; padding: 8px 16px;">
                            🎬 Open Timeline
                        </a>
                        ${!job.is_complete
                            ? `<button onclick="continueJob('${job.job_id}')" class="btn btn-secondary" style="font-size: 13px; padding: 8px 16px;">▶️ Continue</button>`
                            : ''
                        }
                    </div>
                </div>
            `;
        });

        html += '</div>';
        document.getElementById('jobs-list').innerHTML = html;

    } catch (error) {
        console.error('Failed to load jobs:', error);
        document.getElementById('jobs-list').innerHTML = '<p style="color: #ef4444;">Failed to load jobs</p>';
    }
}

async function continueJob(jobId) {
    if (!confirm('Continue production pipeline for this job?')) return;

    try {
        const response = await fetch(`/api/jobs/${jobId}/continue`, {
            method: 'POST'
        });
        const data = await response.json();
        alert('Pipeline continued!');
        loadJobs();
    } catch (error) {
        alert('Failed to continue job: ' + error.message);
    }
}

async function createSampleJob() {
    if (!confirm('Create a sample test job? This will run the full pipeline in MOCK mode.')) return;

    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '🔄 Creating...';

    try {
        const response = await fetch('/api/test/create-sample', {
            method: 'POST'
        });
        const data = await response.json();
        alert(data.message);
        loadJobs();
    } catch (error) {
        alert('Failed to create sample job: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '🧪 Create Sample Job (Test)';
    }
}

// Load jobs on page load
loadJobs();

// Auto-refresh every 5 seconds
setInterval(loadJobs, 5000);
</script>
{% endblock %}
