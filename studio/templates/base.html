<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Video Studio{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Cards */
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #667eea;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
        }

        .btn-success {
            background: #10b981;
            color: #fff;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        /* Stage indicator */
        .stage-indicator {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .stage {
            padding: 10px 20px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .stage.active {
            background: #667eea;
            border-color: #667eea;
        }

        .stage.complete {
            background: #10b981;
            border-color: #10b981;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Alerts */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
        }

        .alert-warning {
            background: rgba(251, 191, 36, 0.1);
            border-left: 4px solid #fbbf24;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10b981;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🎬 AI Video Production Studio</h1>
            <p class="subtitle">Production-grade automated video factory</p>
            <div class="nav">
                <a href="/">Home</a>
                <a href="/new-production">New Production</a>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Utility functions
        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = '<span class="loading"></span>';
        }

        function hideLoading(elementId, content = '') {
            document.getElementById(elementId).innerHTML = content;
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
