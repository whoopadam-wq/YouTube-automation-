services:
  - type: web
    name: ai-video-studio
    runtime: python
    plan: free
    buildCommand: pip install -r studio/requirements.txt
    startCommand: python studio/app.py
    envVars:
      - key: PORT
        value: 10000
      - key: KIEAI_API_KEY
        value: 74ba78915402a077bb93b3cf140eb904
      - key: STUDIO_MOCK_GENERATION
        value: true
      - key: STUDIO_MOCK_POSTING
        value: true
