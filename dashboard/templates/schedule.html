{% extends "base.html" %}

{% block title %}Schedule - AI Content Automation{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-6 fw-bold">
                <i class="fas fa-calendar"></i> Schedule
            </h1>
            <p class="text-secondary">Automated content generation schedules</p>
        </div>
    </div>

    <div class="row" id="schedules-container">
        <div class="col-12 text-center py-5">
            <span class="spinner-border"></span>
            <p class="mt-3">Loading schedules...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loadSchedules() {
    $.get('/api/channels', function(data) {
        let html = '';

        data.channels.forEach(channel => {
            if (channel.status !== 'active') return;

            html += `
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${channel.name}</h5>
                            <p class="text-secondary"><i class="fas fa-globe"></i> ${channel.niche}</p>

                            ${channel.long_form_enabled ? `
                                <div class="mb-3">
                                    <h6><i class="fas fa-video text-primary"></i> Long-Form Schedule</h6>
                                    <p class="text-secondary mb-1">Check channel config for schedule details</p>
                                </div>
                            ` : ''}

                            ${channel.shorts_enabled ? `
                                <div class="mb-3">
                                    <h6><i class="fas fa-mobile-alt text-success"></i> Shorts Schedule</h6>
                                    <p class="text-secondary mb-1">${channel.shorts_per_day} shorts per day</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        });

        if (html === '') {
            html = '<div class="col-12"><p class="text-center text-secondary">No active schedules</p></div>';
        }

        $('#schedules-container').html(html);
    });
}

$(document).ready(function() {
    loadSchedules();
});
</script>
{% endblock %}
