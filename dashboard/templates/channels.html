{% extends "base.html" %}

{% block title %}Channels - AI Content Automation{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-6 fw-bold">
                <i class="fas fa-tv"></i> Channels
            </h1>
            <p class="text-secondary">Manage your YouTube channels and configurations</p>
        </div>
    </div>

    <!-- Channels Grid -->
    <div class="row" id="channels-grid">
        <div class="col-12 text-center py-5">
            <span class="spinner-border spinner-border-lg"></span>
            <p class="mt-3">Loading channels...</p>
        </div>
    </div>
</div>

<!-- Channel Detail Modal -->
<div class="modal fade" id="channelModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="background: var(--card-bg); color: var(--text-primary);">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Channel Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="text-center py-5">
                    <span class="spinner-border"></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loadChannels() {
    $.get('/api/channels', function(data) {
        let html = '';

        data.channels.forEach(channel => {
            const statusBadge = channel.status === 'active'
                ? '<span class="badge badge-active"><i class="fas fa-circle"></i> Active</span>'
                : '<span class="badge badge-paused"><i class="fas fa-pause"></i> Paused</span>';

            const usagePct = channel.budget_used_pct;
            const progressClass = usagePct >= 90 ? 'bg-danger' : usagePct >= 70 ? 'bg-warning' : 'bg-success';

            html += `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h5 class="card-title mb-1">${channel.name}</h5>
                                    <small class="text-secondary">${channel.id}</small>
                                </div>
                                ${statusBadge}
                            </div>

                            <div class="mb-3">
                                <span class="badge" style="background: rgba(99, 102, 241, 0.2);">
                                    <i class="fas fa-tag"></i> ${channel.niche}
                                </span>
                                <span class="badge" style="background: rgba(139, 92, 246, 0.2);">
                                    <i class="fas fa-palette"></i> ${channel.visual_style}
                                </span>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <small>Budget Usage</small>
                                    <small>${usagePct.toFixed(1)}%</small>
                                </div>
                                <div class="progress">
                                    <div class="progress-bar ${progressClass}" style="width: ${usagePct}%"></div>
                                </div>
                                <div class="d-flex justify-content-between mt-1">
                                    <small class="text-secondary">${formatCurrency(channel.daily_spent)}</small>
                                    <small class="text-secondary">${formatCurrency(channel.daily_budget)}</small>
                                </div>
                            </div>

                            <div class="row text-center mb-3">
                                <div class="col-6">
                                    <div class="border-end">
                                        <i class="fas fa-video text-primary"></i>
                                        <p class="mb-0 mt-1">
                                            <strong>${channel.long_form_enabled ? 'ON' : 'OFF'}</strong><br>
                                            <small class="text-secondary">Long-form</small>
                                        </p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <i class="fas fa-mobile-alt text-success"></i>
                                    <p class="mb-0 mt-1">
                                        <strong>${channel.shorts_enabled ? channel.shorts_per_day + '/day' : 'OFF'}</strong><br>
                                        <small class="text-secondary">Shorts</small>
                                    </p>
                                </div>
                            </div>

                            <button class="btn btn-primary w-100" onclick="showChannelDetails('${channel.id}')">
                                <i class="fas fa-eye"></i> View Details
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        $('#channels-grid').html(html);
    });
}

function showChannelDetails(channelId) {
    $('#channelModal').modal('show');
    $('#modalBody').html('<div class="text-center py-5"><span class="spinner-border"></span></div>');

    $.get(`/api/channels/${channelId}`, function(data) {
        const channel = data.channel;
        const stats = data.stats;

        let html = `
            <div class="mb-4">
                <h4>${channel.name}</h4>
                <p class="text-secondary">${channel.topic}</p>
            </div>

            <h6 class="mb-3"><i class="fas fa-info-circle"></i> Channel Information</h6>
            <table class="table table-sm mb-4">
                <tr>
                    <td><strong>YouTube ID</strong></td>
                    <td>${channel.youtube_id}</td>
                </tr>
                <tr>
                    <td><strong>Niche</strong></td>
                    <td><span class="badge bg-primary">${channel.niche}</span></td>
                </tr>
                <tr>
                    <td><strong>Visual Style</strong></td>
                    <td><span class="badge bg-secondary">${channel.visual_style}</span></td>
                </tr>
                <tr>
                    <td><strong>Pacing</strong></td>
                    <td><span class="badge bg-secondary">${channel.pacing_style}</span></td>
                </tr>
                <tr>
                    <td><strong>Timezone</strong></td>
                    <td>${channel.timezone}</td>
                </tr>
            </table>

            <h6 class="mb-3"><i class="fas fa-dollar-sign"></i> Budget & Costs</h6>
            <div class="row mb-4">
                <div class="col-6">
                    <p class="mb-1"><strong>Today</strong></p>
                    <h4>${formatCurrency(stats.daily_cost)}</h4>
                </div>
                <div class="col-6">
                    <p class="mb-1"><strong>This Month</strong></p>
                    <h4>${formatCurrency(stats.monthly_cost)}</h4>
                </div>
            </div>

            <h6 class="mb-3"><i class="fas fa-chart-bar"></i> Cost Breakdown (7 days)</h6>
            <div class="mb-4">
        `;

        for (const [category, cost] of Object.entries(stats.cost_breakdown)) {
            html += `
                <div class="d-flex justify-content-between mb-2">
                    <span>${category.replace('_', ' ')}</span>
                    <strong>${formatCurrency(cost)}</strong>
                </div>
            `;
        }

        html += `
            </div>

            <h6 class="mb-3"><i class="fas fa-video"></i> Recent Videos</h6>
            <div class="list-group">
        `;

        if (data.recent_videos.length > 0) {
            data.recent_videos.forEach(video => {
                const statusClass = {
                    'uploaded': 'success',
                    'upload_pending': 'warning',
                    'failed': 'danger',
                    'script_generation': 'info',
                    'media_generation': 'info'
                }[video.status] || 'secondary';

                html += `
                    <div class="list-group-item" style="background: rgba(30, 41, 59, 0.5); border-color: rgba(255, 255, 255, 0.1);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${video.title || video.video_id}</strong><br>
                                <small class="text-secondary">${formatDate(video.created_at)}</small>
                            </div>
                            <span class="badge bg-${statusClass}">${video.status}</span>
                        </div>
                    </div>
                `;
            });
        } else {
            html += '<p class="text-secondary">No videos yet</p>';
        }

        html += `
            </div>

            <div class="mt-4">
                <h6 class="mb-3"><i class="fas fa-cog"></i> Configuration</h6>
                <p><strong>Base Prompt:</strong></p>
                <div class="alert alert-secondary">${channel.base_prompt}</div>

                <p><strong>Tone Modifiers:</strong></p>
                <div>
        `;

        channel.tone_modifiers.forEach(modifier => {
            html += `<span class="badge bg-info me-1">${modifier}</span>`;
        });

        html += `
                </div>
            </div>
        `;

        $('#modalBody').html(html);
        $('#modalTitle').text(channel.name);
    });
}

// Start auto-refresh
$(document).ready(function() {
    startAutoRefresh(loadChannels, 15000);
});
</script>
{% endblock %}
